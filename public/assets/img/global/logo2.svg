<svg xmlns="http://www.w3.org/2000/svg" width="168" height="70" viewBox="0 0 240 100" role="img" aria-label="tomo">
  <title>tomo</title>
  <defs>
    <style>
      /* PixelMplus12 Regular (subset: "tomo"). Embedded as data URI because SVG loaded via &lt;img&gt; cannot fetch external fonts.
         Source: /assets/fonts/PixelMplus12-Regular.woff2 (M+ FONT LICENSE) */
      @font-face {
        font-family: 'PixelMplus12Logo';
        src: url(data:font/woff2;base64,) format('woff2'),
             url('../../fonts/PixelMplus12-Regular.woff2') format('woff2');
      }
      text { font-family: 'PixelMplus12Logo', 'PixelMplus12', monospace; font-size: 120px; }
    </style>
  </defs>
  <!-- 10 viewBox units = 1 font dot (font-size 120 = 12 dots). Shadow: 1 dot right-down -->
  <text x="10" y="96" fill="#000">tomo</text>
  <text x="0" y="86" fill="#fff">tomo</text>
</svg>
