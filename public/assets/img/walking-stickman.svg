<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="歩く棒人間" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { color: #222; }
    @media (prefers-color-scheme: dark) { :root { color: #eee; } }

    /* 歩く速さ：1歩行サイクルの秒数（小さいほど速い） */
    .fig { --t: 1s; }

    .limb { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .rot  { animation-duration: var(--t); animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

    .bob       { animation: bob calc(var(--t) / 2) infinite ease-in-out; }
    .thigh     { animation-name: thigh; }
    .knee      { animation-name: knee; }
    .uarm      { animation-name: uarm; }
    .farm      { animation-name: farm; }
    .b         { animation-delay: calc(var(--t) / -2); }

    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes thigh { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
    @keyframes knee  { 0%,100% { transform: rotate(5deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(65deg); } }
    @keyframes uarm  { 0%,100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
    @keyframes farm  { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(-55deg); } }

    @media (prefers-reduced-motion: reduce) { .rot, .bob { animation: none; } }
  </style>

  <g class="fig">
    <g class="bob">
      <!-- 頭 -->
      <circle cx="100" cy="42" r="15" fill="none" stroke="currentColor" stroke-width="6"/>
      <!-- 胴体 -->
      <line class="limb" x1="100" y1="60" x2="100" y2="110"/>

      <!-- 奥側の腕（脚Aと同じ側＝逆位相） -->
      <g transform="translate(100,66)">
        <g class="rot uarm b">
          <line class="limb" x1="0" y1="0" x2="0" y2="25"/>
          <g transform="translate(0,25)">
            <g class="rot farm b"><line class="limb" x1="0" y1="0" x2="0" y2="25"/></g>
          </g>
        </g>
      </g>
      <!-- 奥側の脚 -->
      <g transform="translate(100,110)">
        <g class="rot thigh b">
          <line class="limb" x1="0" y1="0" x2="0" y2="32"/>
          <g transform="translate(0,32)">
            <g class="rot knee b"><line class="limb" x1="0" y1="0" x2="0" y2="32"/></g>
          </g>
        </g>
      </g>

      <!-- 手前側の脚 -->
      <g transform="translate(100,110)">
        <g class="rot thigh">
          <line class="limb" x1="0" y1="0" x2="0" y2="32"/>
          <g transform="translate(0,32)">
            <g class="rot knee"><line class="limb" x1="0" y1="0" x2="0" y2="32"/></g>
          </g>
        </g>
      </g>
      <!-- 手前側の腕 -->
      <g transform="translate(100,66)">
        <g class="rot uarm">
          <line class="limb" x1="0" y1="0" x2="0" y2="25"/>
          <g transform="translate(0,25)">
            <g class="rot farm"><line class="limb" x1="0" y1="0" x2="0" y2="25"/></g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
