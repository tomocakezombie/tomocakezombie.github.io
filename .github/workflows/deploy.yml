name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # GitHub の実績（草など）を更新するため、毎日 1 回ビルドし直す（UTC 18:00 = 日本時間 3:00）
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        env:
          # build/fetch-github-stats.mjs が GitHub GraphQL API を呼ぶのに使う
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # ランナーにキャッシュされた古いパッチ版が使われないよう、修正版を明示する
          # Node.js のセキュリティリリースが出たらここを上げる（https://nodejs.org/en/blog/vulnerability）
          node-version: 24.22.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
